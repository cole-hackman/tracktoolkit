name: Deploy to Azure App Service

#
# Auth is OIDC (no long-lived secret): the `azure` GitHub environment is the
# federated-credential subject, so any branch can deploy through it. The three
# AZURE_* values are repository variables, not secrets — they are identifiers.
# Every merge to main deploys (the cutover in docs/internal/MIGRATION.md is
# done; this replaced DigitalOcean's deploy_on_push on 2026-09-22). Pushes that
# only touch documentation, the infra templates, the license or the standalone
# uptime monitor in tools/uptime-worker skip the run;
# infra changes go through infra/deploy.sh. Manual dispatch stays for redeploys.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'infra/**'
      - '.gitignore'
      - 'LICENSE'
      - 'tools/uptime-worker/**'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and deploy (defaults to the ref the run was started from)
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-deploy
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: tracktoolkit
  NODE_VERSION: 22

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: azure
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend-UI/package-lock.json

      # Root install generates the Prisma client for linux-x64 (the App
      # Service image), which is why the build happens here and not on a Mac.
      - name: Install server dependencies
        run: npm ci

      - name: Run server tests
        run: npm test

      # NEXT_PUBLIC_API_BASE stays unset: same-origin means fetch('/api/...').
      - name: Build frontend (static export)
        working-directory: frontend-UI
        run: |
          npm ci
          npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      # What the running app reports from /health. HEAD, not github.sha: a
      # manual dispatch with a `ref` input builds that ref, and the smoke test
      # below must compare against what was actually built.
      - name: Record deployed commit
        run: |
          sha=$(git rev-parse HEAD)
          printf '{"commit":"%s"}\n' "$sha" > server/build-info.json
          echo "DEPLOY_SHA=$sha" >> "$GITHUB_ENV"
          cat server/build-info.json

      - name: Package
        run: |
          zip -qr deploy.zip \
            package.json package-lock.json \
            server prisma \
            node_modules \
            frontend-UI/out
          ls -la deploy.zip

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: deploy.zip
          type: zip

      # Passes only when the live app answers 200 AND reports the commit this
      # run built. A 200 alone is not enough: the previous version keeps
      # answering while the new one restarts, and a failed or stuck deploy
      # leaves the old commit serving. 40 tries x 10 s covers the restart.
      - name: Smoke test /health reports the deployed commit
        run: |
          url="https://${AZURE_WEBAPP_NAME}.azurewebsites.net/health"
          live=""
          for i in $(seq 1 40); do
            body=$(curl -s --max-time 10 "$url" || true)
            live=$(printf '%s' "$body" | jq -r '.commit // "none"' 2>/dev/null || echo "unreadable")
            echo "attempt $i: live=$live expected=$DEPLOY_SHA"
            [ "$live" = "$DEPLOY_SHA" ] && exit 0
            sleep 10
          done
          echo "::error::Live /health reports '$live', expected '$DEPLOY_SHA'. The deploy did not take effect."
          exit 1
